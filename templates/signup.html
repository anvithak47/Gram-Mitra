{% extends "base.html" %}
{% block content %}
<section class="auth-wrap">
  <div class="auth-card">
    <div class="auth-symbol">✦</div>
    <h1 data-i18n="create_workspace">Create your workspace</h1>
    <p data-i18n="signup_text">Start your local business analysis in minutes.</p>

    {% if error %}
      <div class="error" data-i18n="{{ error_key or 'generic_error' }}">{{ error }}</div>
    {% endif %}

    <form method="POST">
      {% if signup %}
        <div class="form-group">
          <label data-i18n="full_name">Full name</label>
          <input type="text" name="name" required minlength="2" data-i18n-placeholder="your_name" placeholder="Your name">
        </div>
      {% endif %}

      <div class="form-group">
        <label data-i18n="email">Email</label>
        <input type="email" name="email" required placeholder="you@example.com">
      </div>

      <div class="form-group">
        <label data-i18n="password">Password</label>
        <input type="password" name="password" required minlength="6" data-i18n-placeholder="password_min" placeholder="Minimum 6 characters">
      </div>

      <button class="btn full" type="submit" data-i18n="create_account">Create account</button>
    </form>

    <p class="auth-switch">
      <span data-i18n="already">Already have an account?</span> 
      <a data-i18n="login" href="{{ url_for('login') }}">Login</a>
    </p>
  </div>
</section>
{% endblock %}
